
services:
  # Aplicação Next.js (Frontend + API)
  app:
    build:
      context: .
      dockerfile: dockerfile

    container_name: fit-app
    restart: unless-stopped
    command: npm run dev

    ports:
      - "${FRONT_PORT:-3000}:3000"

    environment:
      NODE_ENV: development
      TZ: America/Sao_Paulo
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Banco de dados
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-fit}
      DB_USER: ${DB_USER:-fit}
      DB_PASSWORD: ${DB_PASSWORD:-fit_password}

      DATABASE_URL: mysql://${DB_USER:-fit}:${DB_PASSWORD:-fit_password}@${DB_HOST:-mysql}:${DB_PORT:-3306}/${DB_NAME:-fit}

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - next_build:/app/.next

  # Banco de dados
  mysql:
    image: mysql:8.4
    container_name: fit-mysql
    restart: unless-stopped

    command: ["mysqld", "--default-time-zone=-03:00"]

    environment:
      TZ: America/Sao_Paulo
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-fit}
      DB_USER: ${DB_USER:-fit}
      DB_PASSWORD: ${DB_PASSWORD:-fit_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}


    ports:
      - "${DB_PORT:-3307}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
  node_modules:
  next_build:
